name: Tests
on: [pull_request, workflow_dispatch]

jobs:
  test:
    if: github.repository_owner == 'ParkingReformNetwork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: '3.13'
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just lint
      - run: just check
      - run: just test
