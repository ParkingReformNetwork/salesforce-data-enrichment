[project]
name = "salesforce-data-enrichment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "geopy",
    "mailchimp3",
    "python-Levenshtein",
    "pydantic",
    "simple-salesforce",
    "uszipcode",
    "sqlalchemy<2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

