[project]
name = "salesforce-data-enrichment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "geopy",
    "mailchimp3",
    "python-Levenshtein",
    "pydantic",
    "simple-salesforce",
    "uszipcode",
    "sqlalchemy<2",
]

[project.scripts]
salesforce-data-enrichment = "salesforce_data_enrichment.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]
